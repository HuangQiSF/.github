<svg width="100%" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto; display: block;">
    <!-- 1. 背景图（换成你自己的链接） -->
    <image href="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070&auto=format&fit=crop" 
           width="800" height="400" preserveAspectRatio="xMidYMid slice" />
    
    <!-- 2. 仅一层半透明黑底，保证白字看得清（最简） -->
    <rect width="800" height="400" fill="rgba(0,0,0,0.45)" />
    
    <!-- 3. 第一行：超大 "三端一码" 黑体，纯白 -->
    <text x="50%" y="42%" dominant-baseline="central" text-anchor="middle" 
          font-family="'SimHei', 'Microsoft YaHei', sans-serif" 
          font-size="100" font-weight="bold" fill="#FFFFFF">
      三端一码
    </text>
    
    <!-- 4. 第二行："天山工程"，同样黑体白字 -->
    <text x="50%" y="70%" dominant-baseline="central" text-anchor="middle" 
          font-family="'SimHei', 'Microsoft YaHei', sans-serif" 
          font-size="40" font-weight="bold" fill="#FFFFFF">
      天山工程
    </text>
  </svg>
